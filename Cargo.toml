[package]
name = "tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
opencv = { version = "0.98.2", features = ["calib3d", "features2d", "imgproc", "videoio"] }
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"
nalgebra = "0.33"
plotters = "0.3"
num-traits = "0.2"
